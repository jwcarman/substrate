site_name: Substrate
site_description: Distributed primitives for Java, on the infrastructure you already run.
site_url: https://jwcarman.github.io/substrate/
repo_url: https://github.com/jwcarman/substrate
repo_name: jwcarman/substrate
edit_uri: edit/main/docs/

docs_dir: docs

validation:
  anchors: warn
  links:
    absolute_links: warn

# Design specs, plans and working notes stay out of the site.
exclude_docs: |
  /requirements.*
  /superpowers/
  /plans/
  /native-image-hints.md

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Source Sans 3
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/jwcarman.css
  - stylesheets/substrate.css

plugins:
  - search
  # https://llmstxt.org: an index of the docs for coding agents at /llms.txt, every page in
  # one file at /llms-full.txt, and a Markdown copy of each page beside its HTML.
  - llmstxt:
      full_output: llms-full.txt
      markdown_description: |
        Substrate gives Java 25 / Spring Boot 4 applications three distributed primitives (Atom, Journal
        and Mailbox) on the infrastructure they already run. Maven coordinates: `org.jwcarman.substrate`;
        import `substrate-bom` and `codec-bom`, then add `substrate-core`, `codec-spring-boot-starter`, a
        codec backend such as `codec-jackson`, and one backend module such as `substrate-redis`. The
        changelog says what each version has: https://github.com/jwcarman/substrate/blob/main/CHANGELOG.md.
      sections:
        Start here:
          - index.md: what Substrate is, the three primitives and the main backends
          - guides/getting-started.md: the dependencies and a first Atom, Journal and Mailbox
          - concepts/index.md: subscriptions, NextResult outcomes, lifecycles, TTL ceilings and notifications
        Primitives:
          - primitives/atom.md: the Atom API, leases, compare-and-set and coalescing subscriptions
          - primitives/journal.md: the Journal API, entries, checkpoints, completion and how backends differ
          - primitives/mailbox.md: the Mailbox API, one delivery and waiting for it
        Backends:
          - backends/index.md: the backend matrix, choosing and combining modules, and notifiers
          - backends/in-memory.md: the built-in fallback for development, tests and single nodes
          - backends/redis.md: substrate-redis, Lettuce single-node, streams and pub/sub
          - backends/postgresql.md: substrate-postgresql, tables, sweeping and LISTEN/NOTIFY
          - backends/hazelcast.md: substrate-hazelcast, maps, ring buffers and topics
          - backends/nats.md: substrate-nats, JetStream buckets with per-bucket TTLs
          - backends/mongodb.md: substrate-mongodb, collections and TTL indexes
          - backends/dynamodb.md: substrate-dynamodb, tables and enabling DynamoDB TTL
          - backends/cassandra.md: substrate-cassandra, Atom and Journal with lightweight transactions
          - backends/etcd.md: substrate-etcd, Atom on leases and transactions
          - backends/rabbitmq.md: substrate-rabbitmq, a stream-based Journal and a fanout notifier
          - backends/sns.md: substrate-sns, a notifier over SNS and per-node SQS queues
        Guides:
          - guides/encryption.md: AES-GCM encryption at rest with substrate-crypto and key rotation
          - guides/testing.md: unit tests on the in-memory backend, subscriptions and Testcontainers
          - guides/operating.md: subscription costs, sweeping, failures, shutdown and logging
          - guides/native.md: GraalVM native images and the hints you register
        Reference:
          - reference/configuration.md: every substrate.* property and its default
          - reference/exceptions.md: every exception, which call throws it and when
          - reference/design-principles.md: the choices behind Substrate

nav:
  - Home: index.md
  - Guides:
      - Getting Started: guides/getting-started.md
      - Encryption at Rest: guides/encryption.md
      - Testing: guides/testing.md
      - Operating in Production: guides/operating.md
      - Native Images: guides/native.md
  - Concepts: concepts/index.md
  - Primitives:
      - Atom: primitives/atom.md
      - Journal: primitives/journal.md
      - Mailbox: primitives/mailbox.md
  - Backends:
      - Choosing a Backend: backends/index.md
      - In-Memory: backends/in-memory.md
      - Redis: backends/redis.md
      - PostgreSQL: backends/postgresql.md
      - Hazelcast: backends/hazelcast.md
      - NATS: backends/nats.md
      - MongoDB: backends/mongodb.md
      - DynamoDB: backends/dynamodb.md
      - Cassandra: backends/cassandra.md
      - etcd: backends/etcd.md
      - RabbitMQ: backends/rabbitmq.md
      - SNS and SQS: backends/sns.md
  - Reference:
      - Configuration: reference/configuration.md
      - Exceptions: reference/exceptions.md
      - Design Principles: reference/design-principles.md
      - API (Javadoc): https://jwcarman.github.io/substrate/api/latest/
      - Changelog: https://github.com/jwcarman/substrate/blob/main/CHANGELOG.md
